<div class="container">
  <table tuiTable class="table" [columns]="columns">
    <thead>
      <tr tuiThGroup>
        <th tuiTh>Date</th>
        <th tuiTh>Sum</th>
      </tr>
    </thead>

    <tbody tuiTbody [data]="data">
      <tr *ngFor="let item of data" tuiTr>
        <td *tuiCell="'balance'" tuiTd>
          {{ item.sum }}
        </td>
      </tr>
    </tbody>
  </table>

  <table tuiTable class="table" [columns]="columns2">
    <thead>
      <tr tuiThGroup>
        <th tuiTh>Date</th>
        <th tuiTh>Sum</th>
      </tr>
    </thead>

    <tbody tuiTbody [data]="data2">
      <tr *ngFor="let item of data2" tuiTr>
        <td *tuiCell="'balance'" tuiTd>
          {{ item.sum }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
